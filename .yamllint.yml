---
extends: default

ignore:
  - .venv/
  - .kube/  # local kubeconfig with the cluster admin key: never lint or print it

rules:
  comments:
    min-spaces-from-content: 2
  comments-indentation: disable
  document-start:
    present: true
  indentation:
    spaces: 2
    indent-sequences: consistent
  line-length:
    max: 160
    level: warning
  truthy:
    check-keys: false
