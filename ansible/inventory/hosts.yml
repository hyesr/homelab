---
# Host names are the Lima instance names (see NODES in scripts/vms.sh).
# ansible_host is Lima's SSH alias for each VM ("lima-<instance name>"). It is written out
# per host on purpose: a templated value such as "lima-{{ inventory_hostname }}" is
# evaluated in the context of the *current* host when a task is delegated, so a task
# delegated to homelab-cp would connect to the worker instead.
all:
  children:
    k3s_cluster:
      children:
        k3s_server:
          hosts:
            homelab-cp:
              ansible_host: lima-homelab-cp
        k3s_agent:
          hosts:
            homelab-w1:
              ansible_host: lima-homelab-w1
            homelab-w2:
              ansible_host: lima-homelab-w2
