---
# Expects: k3s_service_name, k3s_install_environment and k3s_restart_required
# (set by server.yml / agent.yml). k3s_restart_required is true when the configuration
# or a token file changed, so a running node picks up the change.
- name: Download the K3s install script of the pinned release
  ansible.builtin.get_url:
    url: "{{ k3s_install_script_url }}"
    dest: /usr/local/sbin/k3s-install.sh
    owner: root
    group: root
    mode: "0755"
    # Downloaded only when the file on disk doesn't match this checksum (for example after
    # a version bump), and rejected if the download doesn't match it. No "force": with
    # force, check mode can't compare and always reports a change.
    checksum: "{{ k3s_install_script_checksum }}"

- name: Read the installed K3s version
  ansible.builtin.command: /usr/local/bin/k3s --version
  register: k3s_installed_version
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install or upgrade K3s when the version differs
  ansible.builtin.command: /usr/local/sbin/k3s-install.sh
  environment: "{{ k3s_install_environment | combine({'INSTALL_K3S_VERSION': k3s_version}) }}"
  register: k3s_install_result
  changed_when: true
  when: k3s_version not in (k3s_installed_version.stdout | default(''))

- name: Restart K3s to apply a configuration or token change
  ansible.builtin.systemd_service:
    name: "{{ k3s_service_name }}"
    state: restarted
  when:
    - k3s_restart_required | bool
    - k3s_install_result is skipped

- name: Make sure the K3s service is enabled and running
  ansible.builtin.systemd_service:
    name: "{{ k3s_service_name }}"
    state: started
    enabled: true
