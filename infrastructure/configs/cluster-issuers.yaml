---
# Internal certificate authority for the homelab:
#   selfsigned issuer -> signs the CA certificate -> CA issuer signs the app certificates.
# Install the CA certificate on your devices to make the browser trust the apps.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: homelab-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: homelab-ca
  secretName: homelab-ca-secret
  duration: 87600h
  privateKey:
    algorithm: ECDSA
    size: 256
  # Devices that trust this CA accept what it signs, so limit it to home.arpa: a certificate
  # it signs for any other domain, or for an IP address, fails in every client that checks
  # name constraints (browsers, macOS, OpenSSL). cert-manager itself does not check them.
  nameConstraints:
    critical: true
    permitted:
      dnsDomains:
        - home.arpa
    excluded:
      ipRanges:
        - 0.0.0.0/0
        - ::/0
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: homelab-ca
spec:
  ca:
    secretName: homelab-ca-secret
