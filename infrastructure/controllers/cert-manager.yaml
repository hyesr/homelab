---
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    # The chart's pods run as non-root with a read-only filesystem and no capabilities.
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 24h
  url: oci://quay.io/jetstack/charts/cert-manager
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    # Pinned: an upgrade is a pull request. 1.21 is the newest minor, not one behind, because
    # 1.20 does not support Kubernetes 1.36 (https://cert-manager.io/docs/releases/).
    tag: v1.21.3
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 12h
  chartRef:
    kind: OCIRepository
    name: cert-manager
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    crds:
      enabled: true
      # Keep the CRDs (and the certificates stored in them) if this release is ever removed.
      keep: true
