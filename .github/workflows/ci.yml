---
# Runs the same checks as `make lint` and `make validate` on the Mac mini.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Required by the branch ruleset on main, which matches checks by this exact name:
    # keep it stable (the tools it runs are listed in `make lint`).
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Actions are pinned to a commit SHA; Dependabot proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Python tools
        run: pip install -r requirements-dev.txt
      # shellcheck comes preinstalled on the GitHub-hosted Ubuntu runner.
      - name: Lint
        run: make lint

  validate:
    # Also required by the ruleset on main, by this exact name: keep it stable.
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Not an action, so Dependabot cannot update it: change both values together. The checksum
      # is in the release's CHECKSUMS file (gh release download <version> -R yannh/kubeconform -p CHECKSUMS).
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install kubeconform
        run: |
          archive="$RUNNER_TEMP/kubeconform.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" kubeconform
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # kubectl (which includes kustomize) comes preinstalled on the GitHub-hosted Ubuntu runner.
      - name: Show tool versions
        run: |
          kubectl version --client
          kubeconform -v
      - name: Validate
        run: make validate
