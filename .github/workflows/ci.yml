---
# Runs the same checks as `make lint` on the Mac mini.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Required by the branch ruleset on main, which matches checks by this exact name:
    # keep it stable (the tools it runs are listed in `make lint`).
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Actions are pinned to a commit SHA; Dependabot proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Python tools
        run: pip install -r requirements-dev.txt
      # shellcheck comes preinstalled on the GitHub-hosted Ubuntu runner.
      - name: Lint
        run: make lint
