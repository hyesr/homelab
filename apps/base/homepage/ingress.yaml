---
# home.arpa is the domain reserved for home networks (RFC 8375).
# Until Pi-hole serves it, add the host to /etc/hosts on your devices.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
  annotations:
    cert-manager.io/cluster-issuer: homelab-ca
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - dashboard.home.arpa
      secretName: homepage-tls
  rules:
    - host: dashboard.home.arpa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homepage
                port:
                  name: http
