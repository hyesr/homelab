---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - rbac.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
  - ingress.yaml
# The generated name gets a hash of the contents, so editing a file under config/
# rolls the Deployment automatically.
configMapGenerator:
  - name: homepage-config
    namespace: homepage
    options:
      labels:
        app.kubernetes.io/name: homepage
    files:
      - config/settings.yaml
      - config/services.yaml
      - config/widgets.yaml
      - config/bookmarks.yaml
      - config/kubernetes.yaml
