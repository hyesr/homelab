---
# Everything Flux applies for this cluster, listed explicitly so `make validate` checks it too.
# Without this file Flux would pick up every manifest here on its own; with it, a file that is
# not listed is ignored, so add each new entry point here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - flux-system
  - infrastructure.yaml
  - apps.yaml
